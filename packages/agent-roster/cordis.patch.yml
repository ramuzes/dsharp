# dsh-agent-roster bundle layer: one row mounting the Host half (apply()
# scaffold — apply() writes its boot stages; the store, the agentRoster
# template-CRUD remote, the roster_spawn tool and the authoring tools all
# mount from it). The same package
# also carries the browser half (package.json dsh.client + ./client export),
# which the client module system attaches to this row.
#
# No defaults live here: every field comes from the schema (see index.js
# Config) and is edited on the Plugins page — later layers win, per the usual
# layer order.
- insert:
    - id: agent-roster
      name: dsh-agent-roster
      config: {}
