# dsh-feishu-gateway bundle layer: one row mounting the Feishu gateway.
# Configuration is the Plugins-page form generated from the Config schema:
# appId / domain are plain fields; appSecret is a write-through secret control
# (typed once, stored through the shared ConfigForm, never echoed back). The
# launch environment (FEISHU_APP_SECRET) remains a headless fallback.
- insert:
    - id: feishu-gateway
      name: dsh-feishu-gateway
      config:
        appId: ''
        domain: https://open.feishu.cn
